<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Linus">
    <title>DOM Manipulation Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>DOM Manipulation Demo</h1>
    </header>

    <main>
        <section class="content-section">
            <h2>Dynamic Content</h2>
            <p id="changeable-text">This text will change when you click the button below.</p>
            <button id="change-text-btn">Change Text</button>
        </section>

        <section class="style-section">
            <h2>Style Changes</h2>
            <div id="style-box">This box will change style when clicked.</div>
            <button id="change-style-btn">Change Style</button>
        </section>

        <section class="element-section">
            <h2>Element Manipulation</h2>
            <div id="element-container">
                <p>This is the initial content.</p>
            </div>
            <button id="toggle-element-btn">Toggle Element</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 DOM Manipulation Exercise</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
